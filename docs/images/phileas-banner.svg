<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="880" height="150" role="img" aria-label="Phileas – watch two algorithms race around the world">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3563B8"/>
      <stop offset="0.55" stop-color="#3F82A6"/>
      <stop offset="1" stop-color="#4B8466"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2A36"/>
      <stop offset="1" stop-color="#131A22"/>
    </linearGradient>
  </defs>

  <rect width="880" height="150" rx="20" fill="url(#bg)"/>

  <!-- decorative route with cities on the right -->
  <g fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 9">
    <path d="M610,118 C660,128 700,60 752,82 S830,40 856,22"/>
  </g>
  <g fill="#fff" fill-opacity="0.85">
    <circle cx="610" cy="118" r="6"/>
    <circle cx="752" cy="82" r="6"/>
    <circle cx="856" cy="22" r="6"/>
  </g>

  <!-- logo -->
  <g transform="translate(26 19) scale(0.4375)">
    <rect x="1.5" y="1.5" width="253" height="253" rx="55" fill="url(#tile)" stroke="#BAC8D3" stroke-opacity="0.3" stroke-width="3"/>
    <path d="M128,32 C176,32 204,68 196,106 C190,136 160,154 148,170 L108,170 C96,154 66,136 60,106 C52,68 80,32 128,32 Z" fill="#7AA2E3"/>
    <path d="M128,32 C108,58 108,134 118,170 L138,170 C148,134 148,58 128,32 Z" fill="#C97C5D"/>
    <path d="M112,190 L108,170 M144,190 L148,170" stroke="#BAC8D3" stroke-width="3" stroke-linecap="round"/>
    <rect x="112" y="188" width="32" height="24" rx="4" fill="#BAC8D3"/>
    <path d="M40,226 C84,250 176,250 216,222" fill="none" stroke="#5B8A72" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 11"/>
    <circle cx="40" cy="226" r="7" fill="#BAC8D3"/>
    <circle cx="216" cy="222" r="7" fill="#BAC8D3"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#fff">
    <text x="164" y="68" font-size="52" font-weight="700">Phileas</text>
    <text x="166" y="98" font-size="20" font-weight="600">Watch two algorithms race around the world.</text>
    <text x="166" y="124" font-size="14" fill-opacity="0.85">Simulated Annealing vs. Tabu Search  ·  WPF / MVVM  ·  .NET 10</text>
  </g>
</svg>
